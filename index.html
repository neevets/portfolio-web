<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070d" />
    <script>
      (() => {
        let theme = "dark";

        try {
          const storedTheme = window.localStorage.getItem("portfolio-theme");
          if (storedTheme === "light" || storedTheme === "dark" || storedTheme === "system") {
            theme = storedTheme;
          }
        } catch {
          // Keep the dark default when browser storage is unavailable.
        }

        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches ?? true;
        const resolvedTheme = theme === "system" ? (prefersDark ? "dark" : "light") : theme;
        const root = document.documentElement;

        root.classList.remove("light", "dark");
        root.classList.add(resolvedTheme);
        root.style.colorScheme = resolvedTheme;
        root.style.backgroundColor = resolvedTheme === "dark" ? "#000000" : "#ffffff";
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          resolvedTheme === "dark" ? "#05070d" : "#ffffff"
        );
      })();
    </script>
    <meta name="description" content="Neevets is a backend developer focused on Go, Python APIs, systems programming, and reliable software infrastructure. Explore projects and development services." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <title>Neevets | Backend Developer, Go & Python</title>
    <link rel="canonical" href="https://neevets.com/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neevets" />
    <meta property="og:title" content="Neevets | Backend Developer, Go & Python" />
    <meta property="og:description" content="Backend development, systems programming, Go, Python APIs, and infrastructure projects." />
    <meta property="og:url" content="https://neevets.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Neevets | Backend Developer, Go & Python" />
    <meta name="twitter:description" content="Explore backend development projects, Go, Python APIs, and software infrastructure." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700;800&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Unbounded:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      html { min-height: 100%; background: #000; }
      html.light { background: #fff; }
      body { min-height: 100vh; margin: 0; background: transparent; }
      #root { min-height: 100vh; background: transparent; }
      #initial-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #000;
        opacity: 1;
        visibility: visible;
        transition: opacity 350ms ease, visibility 350ms ease;
      }
      html.light #initial-preloader { background: #fff; }
      #initial-preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #initial-preloader .initial-loader-shape {
        --initial-loader-color: #fff;
        width: 50px;
        aspect-ratio: 1.154;
        position: relative;
        background: conic-gradient(from 120deg at 50% 64%, transparent, var(--initial-loader-color) 1deg 120deg, transparent 121deg);
        animation: initial-loader-rotate 1.5s infinite cubic-bezier(0.3, 1, 0, 1);
      }
      html.light #initial-preloader .initial-loader-shape { --initial-loader-color: #000; }
      #initial-preloader .initial-loader-shape::before,
      #initial-preloader .initial-loader-shape::after {
        content: "";
        position: absolute;
        inset: 0;
        background: inherit;
        transform-origin: 50% 66%;
        animation: initial-loader-orbit 1.5s infinite;
      }
      #initial-preloader .initial-loader-shape::after { --s: -1; }
      @keyframes initial-loader-rotate {
        0%, 30% { transform: rotate(0); }
        70% { transform: rotate(120deg); }
        70.01%, 100% { transform: rotate(360deg); }
      }
      @keyframes initial-loader-orbit {
        0% { transform: rotate(calc(var(--s, 1) * 120deg)) translate(0); }
        30%, 70% { transform: rotate(calc(var(--s, 1) * 120deg)) translate(calc(var(--s, 1) * -5px), 10px); }
        100% { transform: rotate(calc(var(--s, 1) * 120deg)) translate(0); }
      }
      @media (prefers-reduced-motion: reduce) {
        #initial-preloader .initial-loader-shape,
        #initial-preloader .initial-loader-shape::before,
        #initial-preloader .initial-loader-shape::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="initial-preloader" role="status" aria-label="Loading site"><div class="initial-loader-shape" aria-hidden="true"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
